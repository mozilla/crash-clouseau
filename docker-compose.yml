services:
  web:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - .:/code
    # EXPLICIT, because `update.update_all` no longer defaults to anything: an absent or empty
    # `INGEST_CHANNELS` ingests NOTHING and logs a warning. It used to fall back to every
    # configured channel, which is how a local run silently exercised release — and, on
    # production, how release actually got ingested (`plans/20-release-channel-support.md`
    # §1.8). `bin/init.py` calls `update_all()` directly and does not wait for the clock, so
    # without this line a local `docker-compose up` would come up with an empty database and
    # no error, which is the same silent no-op with the opposite sign.
    #
    # Set to the two channels production runs. To smoke-test the release ingestion path
    # locally — the release Buildhub regexp, `put_filelog` against `releases/mozilla-release`,
    # the merge suppression on a real beta->release merge — add `release` HERE, never in
    # production.
    environment:
      - INGEST_CHANNELS=nightly beta
    command: >
      bash -c "python bin/init.py &&
               honcho -d . -f /Procfile start"
    depends_on:
      # Wait until Postgres actually accepts connections, not just until the
      # container starts: bin/init.py connects synchronously (models.create())
      # and would otherwise race the database's first-time initialization.
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    links:
      - postgres
      - redis
  postgres:
    image: postgres
    container_name: postgres
    environment:
      - POSTGRES_USER=clouseau
      - POSTGRES_PASSWORD=passwd
      - POSTGRES_DB=clouseau
    expose:
      - 5432
    healthcheck:
      # -h 127.0.0.1 forces a TCP probe: during first-time init Postgres only
      # listens on the Unix socket (listen_addresses=''), so this stays
      # "unhealthy" until the real server is up and accepting TCP connections.
      test: ["CMD-SHELL", "pg_isready -U clouseau -d clouseau -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
  redis:
    image: redis
    container_name: queue
    expose:
      - 6379
