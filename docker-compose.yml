services:
  web:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - .:/code
    command: >
      bash -c "python bin/init.py &&
               honcho -d . -f /Procfile start"
    depends_on:
      # Wait until Postgres actually accepts connections, not just until the
      # container starts: bin/init.py connects synchronously (models.create())
      # and would otherwise race the database's first-time initialization.
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    links:
      - postgres
      - redis
  postgres:
    image: postgres
    container_name: postgres
    environment:
      - POSTGRES_USER=clouseau
      - POSTGRES_PASSWORD=passwd
      - POSTGRES_DB=clouseau
    expose:
      - 5432
    healthcheck:
      # -h 127.0.0.1 forces a TCP probe: during first-time init Postgres only
      # listens on the Unix socket (listen_addresses=''), so this stays
      # "unhealthy" until the real server is up and accepting TCP connections.
      test: ["CMD-SHELL", "pg_isready -U clouseau -d clouseau -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
  redis:
    image: redis
    container_name: queue
    expose:
      - 6379
