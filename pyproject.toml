[project]
name = "crash-clouseau"
version = "0.1.0"
description = "Tool to help to find patches which are potentially responsible of a crash"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MPL-2.0" }
dependencies = [
    "python-dateutil>=2.9.0",
    "libmozdata>=0.2.12",
    "jinja2>=3.1.6",
    "flask>=3.1.3",
    "flask_sqlalchemy>=3.1.1",
    "flask_cors>=6.0.5",
    "sqlalchemy>=2.0.51",
    "redis>=8.0.0",
    "rq>=2.9.1",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "apscheduler>=3.11.2",
    "pyparsing>=3.3.2",
    "cycler>=0.12.1",
    "parsepatch>=0.1.3",
    "requests>=2.34.2",
    "validate_email>=1.3",
    "pydantic>=2.6",
    "claude-agent-sdk>=0.2",
    "cpp-demangle>=0.1.3",
]

# The dev group is installed by `uv sync` locally but excluded on Heroku, whose
# buildpack runs `uv sync --locked --no-default-groups`. honcho only runs the
# Procfile in local dev (Heroku's dyno manager runs it natively); coverage and
# flake8 are test/lint only. None are imported by the app.
[dependency-groups]
dev = [
    "coverage",
    "flake8",
    "honcho>=2.0.0",
]

# crash-clouseau runs from the source checkout (gunicorn crashclouseau:app), it
# is not built/installed as a wheel, so uv treats it as a virtual project and
# installs only the dependencies above.
[tool.uv]
package = false
